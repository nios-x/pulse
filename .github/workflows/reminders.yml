# Vercel's Hobby plan only runs crons once a day, so the 15-minute reminder sweep
# (dose reminders, missed-dose alerts, refills) is triggered from here instead.
# Needs two repository secrets: APP_URL (e.g. https://pulse.vercel.app) and CRON_SECRET
# (the same value as in Vercel). GitHub may delay scheduled runs by a few minutes.
name: Reminder sweep

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reminders"
